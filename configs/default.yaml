# OmoLSM Configuration

storage:
  dir: "./data"

tree:
  maxLevel: 4
  sstNumPerLevel: 10

sst:
  size: "4MB"
  dataBlockSize: "4KB"
  footerSize: "32B"
  levelDirPrefix: "level_"       # per-level subdirectory: data/level_0/, data/level_1/ ...
  filenameFmt: "%d.sst"          # filename format, %d is the sequence number

filter:
  type: "bloom"
  bloomBits: 10240

memtable:
  type: "treemap"